name: Build and verify

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/test_publication.py
      - run: python scripts/check_publication.py
      - run: git diff --check

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [business, agent]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-test-password
          MYSQL_DATABASE: tianmu_ci_it
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=12
    env:
      BUSINESS_IT: 'true'
      BUSINESS_JDBC_URL: jdbc:mysql://127.0.0.1:3306/tianmu_ci_it?serverTimezone=UTC
      BUSINESS_DB_USER: root
      BUSINESS_DB_PASSWORD: ci-only-test-password
      BUSINESS_REDIS_HOST: 127.0.0.1
      BUSINESS_REDIS_PORT: '6379'
      AGENT_STORAGE_IT: 'true'
      AGENT_JDBC_URL: jdbc:mysql://127.0.0.1:3306/tianmu_ci_it?serverTimezone=UTC
      AGENT_DB_USER: root
      AGENT_DB_PASSWORD: ci-only-test-password
      AGENT_REDIS_HOST: 127.0.0.1
      AGENT_REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate ephemeral test signing key
        run: echo "JWT_SECRET_BASE64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Verify business module against isolated services
        if: matrix.module == 'business'
        run: mvn -B -ntp verify
      - name: Verify Agent module against isolated services
        if: matrix.module == 'agent'
        run: mvn -B -ntp -f tianmu-agent/pom.xml verify
      - name: Verify default no-key demo over HTTP and SSE
        if: matrix.module == 'agent'
        run: python scripts/smoke_demo.py --jar tianmu-agent/target/operations-agent-0.7.0-SNAPSHOT.jar
