name: 能力或改进建议
description: 描述业务场景和可验收的结果
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 要解决的场景
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 建议范围、接口与权限边界
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
    validations:
      required: true
