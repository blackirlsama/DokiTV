server:
  address: 127.0.0.1
  port: 8201
spring:
  application:
    name: dokitv-operations-agent
  profiles:
    default: demo
  mvc:
    async:
      request-timeout: 60000
  jackson:
    time-zone: Asia/Shanghai
harness:
  loop:
    max-turns: 6
    request-timeout: 30s
    model-timeout: 5s
    tool-timeout: 5s
    finalize-timeout: 3s
    consecutive-tool-failures: 3
    finalize-enabled: true
  trace:
    sink: ${HARNESS_TRACE_SINK:file}
    directory: ${HARNESS_TRACE_DIRECTORY:./var/trace}
    max-pending-files: 10000
    max-pending-bytes: 67108864
    max-record-bytes: 65536
    archive-max-bytes: 5242880
    archive-backups: 3
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
      topic: ${KAFKA_TRACE_TOPIC:dokitv.agent.trace.v1}
      security-protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl-mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl-jaas-config: ${KAFKA_SASL_JAAS_CONFIG:}
logging:
  pattern:
    level: "%5p [trace=%X{trace_id:-} span=%X{span_id:-} run=%X{run_id:-}]"
